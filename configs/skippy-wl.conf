# skippy-wl config: copy to ~/.config/skippy-wl/config
# One "key = value" per line. Read each time the overlay opens.

# Pixels around the grid and between tiles; height reserved for each title.
#margin = 48
#spacing = 28
#label_height = 28

# Text under each tile: title, app_id or both.
#label = title

# Pango font description for titles.
#font = Sans 11

# Colors: #RRGGBB or #RRGGBBAA.
#background = #000000ff
#highlight = #5999ff
#border = #ffffff2e

# Labwc theme file to take the highlight and border colors from (only a leading ~/ is expanded).
# Tile borders from the theme use 60% alpha.
# Read each time the overlay opens. highlight and border above win.
#theme_file = ~/.local/share/themes/noctalia/openbox-3/themerc

# Keys: xkb keysym names, comma separated. A line replaces the default keys of that action.
#bind.select = Return, KP_Enter
#bind.cancel = Escape
#bind.close = Delete
#bind.minimize = m, M
#bind.left = Left
#bind.right = Right
#bind.up = Up
#bind.down = Down
#bind.home = Home
#bind.end = End
#bind.next = Tab
#bind.prev = ISO_Left_Tab
